<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Наше пространство</title>
    
    <!-- Подключаем Telegram скрипт -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Библиотека для конфетти -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Подключаем наши стили -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        <h1 id="greeting">Привет!</h1>
        <p class="status-text" id="status">Загрузка...</p>
    </div>

    <div class="card">
        <p class="status-text">Мы вместе уже</p>
        <div class="days-counter" id="days-count">...</div>
        <p class="status-text">дней</p>
    </div>

    <div class="card">
        <p class="status-text">Ваше настроение сейчас</p>
        <div class="mood-row">
            <div class="mood-item" id="my-mood">
                <div class="mood-emoji">😐</div>
                <div class="mood-label">Ты</div>
            </div>
            <div class="mood-item" id="partner-mood">
                <div class="mood-emoji">😐</div>
                <div class="mood-label">Партнёр</div>
            </div>
        </div>
        <div style="margin-top: 15px; font-size: 24px; display: flex; gap: 10px; justify-content: center;">
            <span onclick="setMood('😊')" style="cursor:pointer">😊</span>
            <span onclick="setMood('😍')" style="cursor:pointer">😍</span>
            <span onclick="setMood('😴')" style="cursor:pointer">😴</span>
            <span onclick="setMood('😢')" style="cursor:pointer">😢</span>
            <span onclick="setMood('😡')" style="cursor:pointer">😡</span>
        </div>
    </div>

    <div class="card">
        <button class="hug-btn" id="hug-button" onclick="sendHug()">💖 Отправить сигнал</button>
    </div>

    <div id="toast">Сообщение отправлено!</div>

    <!-- Подключаем наш скрипт -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
